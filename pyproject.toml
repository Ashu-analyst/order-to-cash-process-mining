[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "order-to-cash-process-mining"
version = "1.0.0"
description = "Process discovery, bottleneck, conformance and automation analysis on an order-to-cash event log"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "matplotlib>=3.8", "pyarrow>=14"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
